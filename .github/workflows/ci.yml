# Checks every push and pull request, weekly (to catch Home Assistant changes), and on demand.
# Everything here except hassfest can also be run locally; see CONTRIBUTING.md.
# Every action is pinned to a commit, so a moved tag or branch can't change what runs here; CONTRIBUTING.md says how
# to update them.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format (ruff), panel scripts (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: pip install ruff
      - run: ruff check
      - run: ruff format --check
      - name: Panel scripts parse
        run: for f in custom_components/ingress_proxy/frontend/*.js; do node --check "$f"; done

  hassfest:
    name: Home Assistant's integration checks (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git/config
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master on 2026-11-25

  tests:
    name: Tests (rules, form, set-up and proxy view)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # what Home Assistant 2026.11 runs on; the code uses 3.14-only syntax
      - run: python tests/test_integration.py
      - run: python tests/test_release.py
      - name: Build ingress_proxy.zip, and check it installs
        run: python scripts/build_package.py
