<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3fd1"/><stop offset="1" stop-color="#1c1f5a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#cfdcf5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc97"/><stop offset="1" stop-color="#159a6a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#tile)"/>
  <!-- the app's window -->
  <rect x="72" y="104" width="368" height="292" rx="28" fill="#0f1240" opacity="0.45" transform="translate(0 10)"/>
  <rect x="72" y="104" width="368" height="292" rx="28" fill="url(#screen)"/>
  <path d="M72 132 a28 28 0 0 1 28 -28 h312 a28 28 0 0 1 28 28 v28 h-368 Z" fill="#ffffff"/>
  <circle cx="108" cy="132" r="9" fill="#ff6b6b"/>
  <circle cx="136" cy="132" r="9" fill="#ffc145"/>
  <circle cx="164" cy="132" r="9" fill="#3ddc97"/>
  <!-- traffic both ways through the proxy -->
  <path d="M120 222 H300 V192 L362 240 L300 288 V258 H120 Z" fill="#ff9f43"/>
  <path d="M292 306 H198 V276 L136 324 L198 372 V342 H292 Z" fill="#3bb3ff"/>
  <!-- only people logged in get through -->
  <path d="M384 286 C412 300 438 304 462 300 V364 C462 410 428 438 384 456 C340 438 306 410 306 364 V300 C330 304 356 300 384 286 Z" fill="#0f1240" opacity="0.35" transform="translate(0 8)"/>
  <path d="M384 286 C412 300 438 304 462 300 V364 C462 410 428 438 384 456 C340 438 306 410 306 364 V300 C330 304 356 300 384 286 Z" fill="url(#shield)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <path d="M352 370 L375 393 L418 346" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
